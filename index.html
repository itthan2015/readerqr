<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LongWelaWai · สแกนคูปองอาหาร</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">import 'https://esm.run/@material/web/all.js';</script>
<style>
  :root{
    --md-ref-typeface-brand:'Roboto','Noto Sans Thai',sans-serif;
    --md-ref-typeface-plain:'Roboto','Noto Sans Thai',sans-serif;
    --md-sys-color-primary:#35618e;--md-sys-color-on-primary:#fff;
    --md-sys-color-primary-container:#d1e4ff;--md-sys-color-on-primary-container:#001d36;
    --md-sys-color-error-container:#ffdad6;--md-sys-color-on-error-container:#410002;
    --md-sys-color-surface:#f8f9ff;--md-sys-color-surface-container-low:#f2f3fa;
    --md-sys-color-on-surface:#191c20;--md-sys-color-on-surface-variant:#43474e;--md-sys-color-outline-variant:#c3c6cf;
    --box:min(72vw,62vh,320px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Roboto','Noto Sans Thai',sans-serif;background:#000;color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .material-symbols-outlined{font-size:24px;line-height:1}
  .fill{font-variation-settings:'FILL' 1}
  [hidden]{display:none!important}

  /* camera */
  #reader{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
  .frame{position:fixed;left:50%;top:46%;width:var(--box);height:var(--box);transform:translate(-50%,-50%);border-radius:20px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);pointer-events:none}
  .frame i{position:absolute;width:44px;height:44px;border:4px solid #fff}
  .frame .tl{left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:20px}
  .frame .tr{right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:20px}
  .frame .bl{left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:20px}
  .frame .br{right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:20px}
  .frame .line{position:absolute;left:8%;right:8%;height:2px;top:8%;background:#7fb8ff;box-shadow:0 0 12px 2px #7fb8ff;border-radius:2px;animation:scan 2s ease-in-out infinite alternate}
  .frame.paused .line{animation-play-state:paused;opacity:0}
  @keyframes scan{from{top:8%}to{top:92%}}
  .hint{position:fixed;left:0;right:0;top:calc(46% + var(--box)/2 + 20px);text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 24px}

  /* top bar */
  .bar{position:fixed;z-index:6;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px 16px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .bar .ttl{flex:1;min-width:0}
  .bar .ttl b{display:block;font-size:18px;font-weight:500}
  .bar .ttl span{font-size:13px;opacity:.85}
  .ib{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .ib:active{background:rgba(255,255,255,.18)}
  .ib:focus-visible{outline:2px solid #fff}
  .ib.on{background:#fff;color:#000}

  /* bottom */
  .bottom{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .chip{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:24px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:15px;font-weight:500;cursor:pointer;border:0;color:#fff;font-family:inherit}
  .chip b{font-size:20px;font-variant-numeric:tabular-nums}

  /* result sheet */
  .res{position:fixed;z-index:7;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;transform:translateY(24px);opacity:0;pointer-events:none;transition:.22s;max-width:480px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .res.show{transform:none;opacity:1;pointer-events:auto}
  .res .material-symbols-outlined{font-size:44px}
  .res .h{font-size:20px;font-weight:600}
  .res .s{font-size:14px;margin-top:2px}
  .res.ok{background:#1f8a4c;color:#fff}
  .res.bad{background:#ba1a1a;color:#fff}
  .res.wait{background:#fff;color:#191c20}

  /* list sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);border-radius:28px 28px 0 0;transform:translateY(100%);transition:.25s;display:flex;flex-direction:column;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.show{transform:none}
  .sheet .hd{display:flex;align-items:center;gap:8px;padding:16px 8px 8px 24px}
  .sheet .hd b{flex:1;font-size:18px;font-weight:500}
  .sheet .bd{overflow:auto;padding:0 16px 16px}
  .item{display:flex;gap:16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--md-sys-color-outline-variant)}
  .item b{width:52px;font-weight:500;font-variant-numeric:tabular-nums}
  .t2{font-size:13px;color:var(--md-sys-color-on-surface-variant)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}

  /* login / start */
  .login{position:fixed;inset:0;overflow:auto;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px;z-index:10}
  .login > *{width:100%;max-width:400px;margin:0 auto}
  .login h1{margin:0;font-size:30px;font-weight:400}
  .start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:3}
  .snack{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:#2e3135;color:#eff0f7;padding:12px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);width:max-content;word-break:break-word;transition:.2s;z-index:20}
  .snack.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<section id="login" class="login" hidden>
  <div><h1>สแกนคูปองอาหาร</h1><div class="t2" style="font-size:14px">LongWelaWai · สำหรับผู้ค้า</div></div>
  <md-outlined-text-field id="u" label="ชื่อผู้ใช้" autocapitalize="none" autocomplete="username"></md-outlined-text-field>
  <md-outlined-text-field id="p" label="รหัสผ่าน" type="password" autocomplete="current-password"></md-outlined-text-field>
  <md-filled-button id="btnLogin" style="--md-filled-button-container-height:48px">เข้าสู่ระบบ</md-filled-button>
</section>

<div id="app" hidden>
  <video id="reader" playsinline muted autoplay></video>
  <div class="frame paused" id="frame" hidden><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><div class="line"></div></div>
  <div class="hint" id="hint" hidden>วาง QR ของพนักงานไว้ในกรอบ</div>

  <div id="startBox" class="start" hidden>
    <span class="material-symbols-outlined" style="font-size:56px">videocam_off</span>
    <div id="startMsg" style="font-size:16px">แตะเพื่อเปิดกล้อง</div>
    <md-filled-button id="btnStart" style="--md-filled-button-container-height:48px"><span class="material-symbols-outlined" slot="icon">videocam</span>เปิดกล้อง</md-filled-button>
  </div>

  <header class="bar">
    <div class="ttl"><b>สแกนคูปองอาหาร</b><span id="who"></span></div>
    <button class="ib" id="btnTorch" aria-label="ไฟฉาย" hidden><span class="material-symbols-outlined">flashlight_on</span></button>
    <button class="ib" id="btnLogout" aria-label="ออกจากระบบ"><span class="material-symbols-outlined">logout</span></button>
  </header>

  <div class="res" id="res"></div>

  <div class="bottom">
    <button class="chip" id="btnList"><span class="material-symbols-outlined">restaurant</span>รับแล้ว <b id="cnt">–</b><span id="elig" style="opacity:.8"></span></button>
    <button class="ib" id="btnRefresh" aria-label="รีเฟรช"><span class="material-symbols-outlined">refresh</span></button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet">
    <div class="hd"><b>รับอาหารวันนี้</b><md-icon-button id="btnClose" aria-label="ปิด"><span class="material-symbols-outlined">close</span></md-icon-button></div>
    <div class="bd" id="list"></div>
  </div>
</div>

<div class="snack" id="snack"></div>

<script>
/* ===== ตั้งค่า (ไม่บังคับ): URL ของ Web app ที่ลงท้าย /exec
   ถ้าเปิดจากปุ่ม "สแกน QR" ในแอป ระบบส่ง URL มาให้อัตโนมัติ ไม่ต้องแก้ ===== */
const GAS_URL_CONFIG = 'https://script.google.com/macros/s/XXXXXXXX/exec';

(function () {
  const $ = s => document.querySelector(s);
  const OK_URL = u => /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(u || '');
  const pApi = new URLSearchParams(location.hash.slice(1)).get('api') || new URLSearchParams(location.search).get('api');
  if (OK_URL(pApi)) localStorage.setItem('lws_api', pApi);
  const GAS_URL = OK_URL(localStorage.getItem('lws_api')) ? localStorage.getItem('lws_api') : GAS_URL_CONFIG;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DEMO = /XXXX/.test(GAS_URL);
  const S = { stream: null, raf: 0, tick: 0, token: localStorage.getItem('lws_token'), cam: null, busy: false, last: '', lastAt: 0, audio: null, torch: false, resT: null };

  function snack(m) { const el = $('#snack'); el.textContent = m; el.classList.add('show'); clearTimeout(snack.t); snack.t = setTimeout(() => el.classList.remove('show'), m.length > 60 ? 9000 : 3500); }

  async function call(fn, ...args) {
    if (DEMO) return Demo[fn](...args);
    if (!OK_URL(GAS_URL)) throw new Error('GAS_URL ไม่ถูกต้อง ต้องเป็น https://script.google.com/macros/s/.../exec');
    let r, j;
    try {
      r = await fetch(GAS_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
    } catch (e) {
      throw new Error('เชื่อมต่อ Apps Script ไม่ได้ · ตรวจ Deploy: Who has access = Anyone และ Deploy เป็น New version แล้ว · ทดสอบโดยเปิด ' + GAS_URL + '?ping=1');
    }
    try { j = await r.json(); }
    catch (e) { throw new Error('Apps Script ไม่ได้ตอบเป็น JSON (อาจยังไม่ได้ Deploy เวอร์ชันที่มี doPost หรือสคริปต์ยังไม่ได้อนุญาตสิทธิ์)'); }
    if (!j.ok) {
      if (String(j.error).includes('SESSION_EXPIRED')) { logout(true); throw new Error('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
      throw new Error(j.error);
    }
    return j.data;
  }

  function beep(ok) {
    try {
      S.audio = S.audio || new (window.AudioContext || window.webkitAudioContext)();
      const a = S.audio, o = a.createOscillator(), g = a.createGain();
      o.frequency.value = ok ? 1320 : 260; o.type = ok ? 'sine' : 'square';
      g.gain.value = 0.15; o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (ok ? 0.12 : 0.45));
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [90, 60, 90]);
  }

  /* ---------- auth ---------- */
  async function doLogin() {
    const b = $('#btnLogin'); b.disabled = true;
    try {
      const r = await call('loginUser', $('#u').value, $('#p').value);
      if (!['vendor', 'admin'].includes(r.employee.role)) throw new Error('บัญชีนี้ไม่มีสิทธิ์สแกน');
      S.token = r.token; localStorage.setItem('lws_token', r.token); $('#p').value = '';
      beep(true); start(r.employee);
    } catch (e) { snack(e.message); }
    finally { b.disabled = false; }
  }
  function logout(silent) {
    if (S.token && !silent) call('logout', S.token).catch(() => {});
    S.token = null; localStorage.removeItem('lws_token');
    stopCam(); $('#app').hidden = true; $('#login').hidden = false;
  }
  function start(emp) {
    $('#login').hidden = true; $('#app').hidden = false;
    $('#who').textContent = emp.full_name || '';
    refresh();
    startCam();
  }

  /* ---------- กล้อง (getUserMedia + jsQR) ---------- */
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  function camFail(e) {
    const raw = String((e && (e.name || e.message)) || e || '');
    const n = ((/([A-Za-z]+Error)/.exec(raw) || [])[1]) || raw.split(':')[0];
    const tip = n === 'NotAllowedError' ? 'อนุญาตกล้องให้เว็บนี้ใน Chrome (แตะไอคอนซ้ายของช่อง URL › สิทธิ์ › กล้อง)'
      : n === 'NotReadableError' ? 'กล้องถูกใช้งานโดยแอปอื่น ปิดแอปนั้นแล้วลองใหม่'
      : n === 'NotFoundError' || n === 'OverconstrainedError' ? 'ไม่พบกล้องหลัง' : 'แตะเปิดกล้องอีกครั้ง';
    overlay(false);
    $('#startMsg').textContent = 'เปิดกล้องไม่ได้' + (n ? ' (' + n + ')' : '') + ' · ' + tip;
    $('#startBox').hidden = false;
  }
  function overlay(on) {
    $('#frame').hidden = !on; $('#hint').hidden = !on;
    $('#frame').classList.toggle('paused', !on);
  }
  async function startCam() {
    if (S.cam) return;
    if (!window.jsQR) return camFail(new Error('โหลดตัวอ่าน QR (jsQR) ไม่สำเร็จ'));
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return camFail(new Error('เบราว์เซอร์ไม่รองรับกล้อง (ต้องเปิดผ่าน https)'));
    $('#startBox').hidden = true;
    S.cam = true;
    const v = $('#reader');
    try {
      S.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      v.srcObject = S.stream;
      v.setAttribute('playsinline', ''); v.muted = true;
      await v.play();
    } catch (e) { await stopCam(); return camFail(e); }
    const tr = S.stream.getVideoTracks()[0];
    try { const cap = tr.getCapabilities ? tr.getCapabilities() : {}; $('#btnTorch').hidden = !cap.torch; } catch (e) { $('#btnTorch').hidden = true; }
    overlay(true);
    loop();
  }
  function loop() {
    if (!S.cam) return;
    S.raf = requestAnimationFrame(loop);
    const now = performance.now();
    if (now - S.tick < 110) return;
    S.tick = now;
    const v = $('#reader');
    if (S.busy || v.readyState < 2 || !v.videoWidth) return;
    const vw = v.videoWidth, vh = v.videoHeight, side = Math.min(vw, vh) * 0.85;
    const n = Math.min(640, Math.round(side));
    cv.width = n; cv.height = n;
    cx.drawImage(v, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, n, n);
    const r = jsQR(cx.getImageData(0, 0, n, n).data, n, n, { inversionAttempts: 'dontInvert' });
    if (r && r.data) onScan(r.data);
  }
  async function stopCam() {
    S.cam = false; cancelAnimationFrame(S.raf); overlay(false);
    S.torch = false; $('#btnTorch').classList.remove('on');
    if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
    const v = $('#reader'); if (v) v.srcObject = null;
  }
  async function toggleTorch() {
    const tr = S.stream && S.stream.getVideoTracks()[0];
    if (!tr) return;
    S.torch = !S.torch;
    try { await tr.applyConstraints({ advanced: [{ torch: S.torch }] }); $('#btnTorch').classList.toggle('on', S.torch); }
    catch (e) { S.torch = false; snack('เปิดไฟฉายไม่ได้'); }
  }

  /* ---------- สแกน ---------- */
  async function onScan(text) {
    const now = Date.now();
    if (S.busy || (text === S.last && now - S.lastAt < 4000)) return;
    S.busy = true; S.last = text; S.lastAt = now;
    $('#frame').classList.add('paused');
    show({ result: 'wait' }, true);
    let ok = false;
    try {
      const r = await call('redeemLunch', S.token, text);
      ok = r.result === 'ok';
      show(r); beep(ok);
      if (ok) refresh();
    } catch (e) { show({ result: 'invalid', reason: e.message }); beep(false); }
    setTimeout(() => { S.busy = false; $('#frame').classList.remove('paused'); }, ok ? 1500 : 2500);
  }
  function show(r, sticky) {
    const th = d => { const [y, m, dd] = String(d || '').split('-').map(Number); return dd ? dd + '/' + m + '/' + (y + 543) : ''; };
    const V = {
      wait:       ['wait', 'hourglass_top', 'กำลังตรวจสอบ…', ''],
      ok:         ['ok', 'check_circle', 'รับอาหารได้', esc(r.full_name) + ' · ' + esc(r.emp_code) + ' · เข้างาน ' + esc(r.clock_in)],
      duplicate:  ['bad', 'block', 'สแกนซ้ำ · รับไปแล้ว', esc(r.full_name) + ' · ' + esc(r.emp_code) + ' · รับเมื่อ ' + esc(r.scanned_at)],
      wrong_date: ['bad', 'event_busy', 'ไม่ตรงวัน · ใช้ไม่ได้', 'QR ของวันที่ ' + th(r.date) + (r.emp_code ? ' · ' + esc(r.emp_code) : '')],
      invalid:    ['bad', 'error', 'ใช้ไม่ได้', esc(r.reason || '') + (r.emp_code ? ' · ' + esc(r.emp_code) : '')],
    }[r.result] || ['bad', 'error', 'ใช้ไม่ได้', ''];
    const el = $('#res');
    el.className = 'res show ' + V[0];
    el.innerHTML = '<span class="material-symbols-outlined fill">' + V[1] + '</span><div><div class="h">' + V[2] + '</div>' + (V[3] ? '<div class="s">' + V[3] + '</div>' : '') + '</div>';
    clearTimeout(S.resT);
    if (!sticky) S.resT = setTimeout(() => el.classList.remove('show'), r.result === 'ok' ? 2200 : 3500);
  }

  async function refresh() {
    try {
      const r = await call('getLunchList', S.token);
      $('#cnt').textContent = r.count;
      $('#elig').textContent = '/ ' + r.eligible;
      $('#list').innerHTML = r.items.map(i => '<div class="item"><b>' + esc(i.time) + '</b><div><div>' + esc(i.full_name) + '</div><div class="t2">' + esc(i.emp_code) + (i.department ? ' · ' + esc(i.department) : '') + ' · เข้างาน ' + esc(i.clock_in || '—') + '</div></div></div>').join('')
        || '<div class="t2" style="padding:24px;text-align:center">ยังไม่มีการรับอาหาร</div>';
    } catch (e) { snack(e.message); }
  }
  function sheet(open) { $('#sheet').classList.toggle('show', open); $('#scrim').hidden = !open; if (open) refresh(); }

  /* ---------- Demo (ยังไม่ได้ตั้ง GAS_URL) ---------- */
  const Demo = (() => {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
    const got = [];
    const hm = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });
    return {
      loginUser: (u, p) => { if (!u || !p) throw new Error('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return { token: 'demo', employee: { full_name: 'ร้านอาหาร (ตัวอย่าง)', role: 'vendor' } }; },
      whoami: () => ({ full_name: 'ร้านอาหาร (ตัวอย่าง)', role: 'vendor' }),
      logout: () => true,
      getLunchList: () => ({ count: got.length, eligible: 12, items: got }),
      redeemLunch: (t, p) => {
        const x = String(p).split('|');
        if (x.length !== 5 || x[0] !== 'LWW1') return { result: 'invalid', reason: 'ไม่ใช่ QR คูปองอาหาร' };
        if (x[2] !== today) return { result: 'wrong_date', date: x[2], emp_code: x[1] };
        const prev = got.find(g => g.emp_code === x[1]);
        if (prev) return { result: 'duplicate', emp_code: x[1], full_name: prev.full_name, scanned_at: prev.time };
        const it = { time: hm(), emp_code: x[1], full_name: 'พนักงาน ' + x[1], clock_in: x[3] };
        got.unshift(it); return Object.assign({ result: 'ok', scanned_at: it.time }, it);
      },
    };
  })();

  /* ---------- init ---------- */
  $('#btnLogin').addEventListener('click', doLogin);
  $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#btnLogout').addEventListener('click', () => logout(false));
  $('#btnRefresh').addEventListener('click', refresh);
  $('#btnStart').addEventListener('click', () => { beep(true); startCam(); });
  $('#btnTorch').addEventListener('click', toggleTorch);
  $('#btnList').addEventListener('click', () => sheet(true));
  $('#btnClose').addEventListener('click', () => sheet(false));
  $('#scrim').addEventListener('click', () => sheet(false));
  $('#res').addEventListener('click', () => $('#res').classList.remove('show'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCam();
    else if (S.token && !$('#app').hidden) startCam();
  });

  const m = /[#&]t=([^&]+)/.exec(location.hash);
  if (m) { S.token = decodeURIComponent(m[1]); localStorage.setItem('lws_token', S.token); history.replaceState(null, '', location.pathname + location.search); }
  if (S.token) call('whoami', S.token).then(start).catch(e => { snack(e.message); logout(true); });
  else $('#login').hidden = false;
})();
</script>
</body>
</html>
